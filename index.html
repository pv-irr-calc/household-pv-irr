<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>户用经营性光伏IRR测算</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:0}
    body{background:#f4f7fa;padding:12px;color:#222}
    .container{max-width:720px;margin:0 auto;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px #00000012}
    h1{font-size:20px;margin-bottom:16px;text-align:center;color:#1f4e96}
    .group{margin-bottom:14px}
    .group-title{font-weight:600;margin-bottom:8px;color:#334155;border-left:4px solid #3474d9;padding-left:8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .item{flex:1;min-width:140px}
    label{display:block;font-size:13px;color:#555;margin-bottom:3px}
    input{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px}
    button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;margin:12px 0}
    .result-box{background:#eff6ff;padding:14px;border-radius:8px;margin:12px 0}
    .result-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #dbeafe}
    .result-line:last-child{border-bottom:none}
    .table-wrap{overflow-x:auto;margin-top:12px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #e2e8f0;padding:6px;text-align:right}
    th{background:#f1f5f9;text-align:center}
  </style>
</head>
<body>
<div class="container">
  <h1>户用经营性光伏25年期IRR测算</h1>

  <div class="group">
    <div class="group-title">基础输入参数</div>
    <div class="row">
      <div class="item">
        <label>销售单价 (元/W)</label>
        <input id="priceW" type="number" step="0.01" value="3.2">
      </div>
      <div class="item">
        <label>建设容量 (W)</label>
        <input id="capW" type="number" step="1" value="100000">
      </div>
    </div>
    <div class="row">
      <div class="item">
        <label>光伏板数量 (块)</label>
        <input id="panelCnt" type="number" step="1" value="200">
      </div>
      <div class="item">
        <label>农户租金 (元/板/年)</label>
        <input id="rentPanel" type="number" step="0.01" value="35">
      </div>
    </div>
    <div class="row">
      <div class="item">
        <label>运维费 (元/W/年)</label>
        <input id="omW" type="number" step="0.001" value="0.025">
      </div>
      <div class="item">
        <label>管理费 (元/W/年)</label>
        <input id="mgmtW" type="number" step="0.001" value="0.015">
      </div>
    </div>
    <div class="row">
      <div class="item">
        <label>首年等效小时(h)</label>
        <input id="h0" type="number" step="0.1" value="1200">
      </div>
      <div class="item">
        <label>电价 (元/kWh)</label>
        <input id="elecPrice" type="number" step="0.01" value="0.42">
      </div>
    </div>
  </div>

  <button onclick="calc()">开始测算</button>

  <div class="result-box" id="resultBox">
    <div class="result-line"><span>初始总投资</span><span id="invTotal">-</span></div>
    <div class="result-line"><span>25年税后IRR</span><span id="irrVal">-</span></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>年份</th>
          <th>发电小时</th>
          <th>电费收入</th>
          <th>租金</th>
          <th>运维+管理</th>
          <th>增值税附加</th>
          <th>所得税</th>
          <th>当年净现金流</th>
        </tr>
      </thead>
      <tbody id="cashTbody"></tbody>
    </table>
  </div>
</div>

<script>
// 税率常量
const VAT_OUT_RATE = 0.13;
const VAT_IN_RATE = 0.09;
const SURTAX_RATE = 0.12;
const STAMP_RATE = 0.0003;
const INC_TAX_RATE = 0.25;

function calcIRR(cashFlows) {
  // 简单牛顿迭代求IRR
  let r = 0.05;
  for(let it=0;it<100;it++){
    let npv=0, deriv=0;
    for(let t=0;t<cashFlows.length;t++){
      const den = Math.pow(1+r, t);
      npv += cashFlows[t]/den;
      deriv -= t*cashFlows[t]/(den*(1+r));
    }
    if(Math.abs(npv)<1e-7) break;
    r = r - npv/deriv;
    if(r<-0.99) r=-0.99;
  }
  return r;
}

function calc(){
  const priceW = Number(document.getElementById('priceW').value);
  const capW = Number(document.getElementById('capW').value);
  const panelCnt = Number(document.getElementById('panelCnt').value);
  const rentPanel = Number(document.getElementById('rentPanel').value);
  const omW = Number(document.getElementById('omW').value);
  const mgmtW = Number(document.getElementById('mgmtW').value);
  const h0 = Number(document.getElementById('h0').value);
  const elecPrice = Number(document.getElementById('elecPrice').value);

  const initInv = capW * priceW;
  const rentYear = rentPanel * panelCnt;
  const omYear = capW * omW;
  const mgmtYear = capW * mgmtW;
  const omMgmtTotal = omYear + mgmtYear;

  const cashFlows = [-initInv];
  const rows = [];
  let hThisYear = h0;

  for(let y=1;y<=25;y++){
    // 衰减规则：第1年衰减1%，2~25每年0.4%
    if(y===1){
      hThisYear = h0 * (1 - 0.01);
    }else{
      hThisYear = hThisYear * (1 - 0.004);
    }
    const elecIncome = (capW / 1000) * hThisYear * elecPrice;
    const stamp = elecIncome * STAMP_RATE;

    const vatOut = elecIncome * VAT_OUT_RATE;
    const vatIn = omMgmtTotal * VAT_IN_RATE;
    let vatPay = vatOut - vatIn;
    if(vatPay < 0) vatPay = 0;
    const surtax = vatPay * SURTAX_RATE;

    // 应纳税所得额
    const taxable = elecIncome - rentYear - omMgmtTotal - stamp;
    const incTax = taxable > 0 ? taxable * INC_TAX_RATE : 0;

    const nc = elecIncome - rentYear - omMgmtTotal - surtax - incTax;
    cashFlows.push(nc);
    rows.push({
      y,
      h: hThisYear,
      elecIncome,
      rent: rentYear,
      ommgmt: omMgmtTotal,
      surtax,
      incTax,
      nc
    })
  }

  const irr = calcIRR(cashFlows);
  document.getElementById('invTotal').innerText = initInv.toFixed(2)+" 元";
  document.getElementById('irrVal').innerText = (irr*100).toFixed(2)+" %";

  const tbody = document.getElementById('cashTbody');
  tbody.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.y}</td>
      <td>${r.h.toFixed(2)}</td>
      <td>${r.elecIncome.toFixed(2)}</td>
      <td>${r.rent.toFixed(2)}</td>
      <td>${r.ommgmt.toFixed(2)}</td>
      <td>${r.surtax.toFixed(2)}</td>
      <td>${r.incTax.toFixed(2)}</td>
      <td>${r.nc.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  })
}
</script>
</body>
</html>
